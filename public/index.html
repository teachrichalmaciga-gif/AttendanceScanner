<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 0.5rem;
        }
        p {
            color: #5f6368;
            margin-bottom: 1.5rem;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #dadce0;
        }
        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        .success {
            background-color: #e6f4ea;
            color: #1e8e3e;
            border: 1px solid #ceead6;
        }
        .error {
            background-color: #fce8e6;
            color: #d93025;
            border: 1px solid #fad2cf;
        }
        button {
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1765cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Attendance Scanner</h1>
        <p>Scan your QR code to record attendance.</p>
        <div id="reader"></div>
        <div id="result"></div>
        <button id="restart-btn" style="display: none;">Scan Again</button>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const resultDiv = document.getElementById('result');
        const restartBtn = document.getElementById('restart-btn');

        const qrCodeSuccessCallback = (decodedText, decodedResult) => {
            // Stop scanning after success
            html5QrCode.stop().then((ignore) => {
                resultDiv.innerText = `Attendance recorded for: ${decodedText}`;
                resultDiv.className = 'success';
                resultDiv.style.display = 'block';
                restartBtn.style.display = 'inline-block';
            }).catch((err) => {
                console.error("Failed to stop scanning.", err);
            });
        };

        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        function startScanner() {
            resultDiv.style.display = 'none';
            restartBtn.style.display = 'none';
            html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
                .catch((err) => {
                    resultDiv.innerText = `Error: ${err}`;
                    resultDiv.className = 'error';
                    resultDiv.style.display = 'block';
                });
        }

        restartBtn.addEventListener('click', startScanner);

        // Start automatically on load
        window.addEventListener('load', startScanner);
    </script>
</body>
</html>
